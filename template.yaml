AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CMDB 자산 수집 멀티 에이전트 — CrowdStrike Hosts API 수집기

Globals:
  Function:
    Timeout: 300
    MemorySize: 512

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  CrowdStrikeSecretName:
    Type: String
    Default: cmdb/crowdstrike
  BackendSecretName:
    Type: String
    Default: cmdb/backend-api
  AwsTargetSecretName:
    Type: String
    Default: cmdb/aws-target
    Description: 수집 대상 AWS 계정 IAM User Access Key (cross-account)
  DbSecretName:
    Type: String
    Default: cmdb/db-writer
    Description: Aurora PostgreSQL 접속 정보 (rag_embedder 전용)
  ScheduleExpression:
    Type: String
    Default: "rate(1 hour)"
    Description: EventBridge 스케줄 표현식
  RagEmbedScheduleExpression:
    Type: String
    Default: "cron(55 19 * * ? *)"
    Description: RAG 임베더 스케줄 (UTC 19:55 = KST 04:55, Perception 배치 04:50 직후)
  KevScheduleExpression:
    Type: String
    Default: "cron(15 18 * * ? *)"
    Description: KEV 수집 스케줄 (UTC 18:15 = KST 03:15)
  EpssScheduleExpression:
    Type: String
    Default: "cron(30 18 * * ? *)"
    Description: EPSS 수집 스케줄 (UTC 18:30 = KST 03:30)
  NvdScheduleExpression:
    Type: String
    Default: "cron(45 18 * * ? *)"
    Description: NVD CVE 수집 스케줄 (UTC 18:45 = KST 03:45)
  MitreCweScheduleExpression:
    Type: String
    Default: "cron(0 19 1 */3 ? *)"
    Description: MITRE CWE 수집 스케줄 (분기 1회 — 1·4·7·10월 1일 UTC 19:00 = KST 04:00)
  ExploitSignalScheduleExpression:
    Type: String
    Default: "rate(15 minutes)"
    Description: Exploit-DB + Metasploit 신호 수집 스케줄 (Pre-EPSS 선행 감지)
  KisaScheduleExpression:
    Type: String
    Default: "cron(0 19 * * ? *)"
    Description: KISA 보안공지 수집 스케줄 (일 1회 UTC 19:00 = KST 04:00)
  PsirtScheduleExpression:
    Type: String
    Default: "cron(0 19 * * ? *)"
    Description: 네트워크 장비 PSIRT 4벤더 통합 수집 (일 1회 UTC 19:00 = KST 04:00)
  CiscoPsirtSecretName:
    Type: String
    Default: cmdb/psirt/cisco
    Description: Cisco openVuln API OAuth Token (옵션 — 미설정 시 Cisco skip)
  TrivyScanScheduleExpression:
    Type: String
    Default: "cron(30 19 * * ? *)"
    Description: Trivy 전체 자산 스캔 (일 1회 UTC 19:30 = KST 04:30, NVD 수집 다음)
  TrivyDbRefreshScheduleExpression:
    Type: String
    Default: "rate(6 hours)"
    Description: Trivy DB OCI 이미지 갱신 (6시간 — ghcr.io trivy-db pull)
  CsAlertsScheduleExpression:
    Type: String
    Default: "rate(15 minutes)"
    Description: CrowdStrike Alerts 수집 스케줄 (실시간 위협)
  CsAppsScheduleExpression:
    Type: String
    Default: "cron(0 19 * * ? *)"
    Description: CrowdStrike Apps (Discover) 수집 스케줄 (UTC 19:00 = KST 04:00, 일 1회)
  SbomBucketName:
    Type: String
    Default: gsretail-sbom
    Description: Ansible SBOM JSON 업로드 대상 S3 버킷 이름 (자산 → S3 → Lambda)
  AssetEnrichBucketName:
    Type: String
    Default: gsretail-asset-enrich
    Description: ECS Ansible 보강 결과 JSON 업로드 대상 S3 버킷 (4 카테고리)

Resources:
  CrowdStrikeCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-crowdstrike-collector-${Environment}"
      Description: CrowdStrike Hosts API에서 디바이스 자산을 수집하여 백엔드에 전송
      Environment:
        Variables:
          CS_SECRET_NAME: !Ref CrowdStrikeSecretName
          BACKEND_SECRET_NAME: !Ref BackendSecretName
          BATCH_SIZE: "500"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CrowdStrikeSecretName}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BackendSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: CrowdStrike 자산 수집 스케줄
            Enabled: true
    Metadata:
      Dockerfile: src/agents/crowdstrike/Dockerfile
      DockerContext: .
      DockerTag: latest

  AwsEc2CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-aws-ec2-collector-${Environment}"
      Description: 대상 AWS 계정의 EC2 인스턴스를 수집하여 백엔드에 전송
      Environment:
        Variables:
          AWS_TARGET_SECRET_NAME: !Ref AwsTargetSecretName
          BACKEND_SECRET_NAME: !Ref BackendSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AwsTargetSecretName}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BackendSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: AWS EC2 자산 수집 스케줄
            Enabled: true
    Metadata:
      Dockerfile: src/agents/aws/Dockerfile
      DockerContext: .
      DockerTag: latest

  RagEmbedderFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-rag-embedder-${Environment}"
      Description: tb_asset_master x tb_asset_perception -> tb_rag_asset 임베딩 (Bedrock Titan v2)
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
          BEDROCK_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Cohere Embed V4 Global cross-region profile + all backing foundation models
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.cohere.embed-v4:0"
                - "arn:aws:bedrock:*::foundation-model/cohere.embed-v4:0"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref RagEmbedScheduleExpression
            Description: RAG 임베딩 일일 배치 (KST 04:55)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/rag_embedder/Dockerfile
      DockerContext: .
      DockerTag: latest

  KevCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-kev-collector-${Environment}"
      Description: CISA KEV JSON feed → tb_kev_catalog UPSERT
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref KevScheduleExpression
            Description: KEV 일일 수집 (KST 03:15)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/kev_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  EpssCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-epss-collector-${Environment}"
      Description: FIRST EPSS CSV.gz → tb_epss_score UPSERT (대량 ~250K rows)
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref EpssScheduleExpression
            Description: EPSS 일일 수집 (KST 03:30)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/epss_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  NvdCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-nvd-collector-${Environment}"
      Description: NVD CVE 2.0 API → tb_cve_meta + tb_cve_cpe_match + tb_cpe_dictionary
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref NvdScheduleExpression
            Description: NVD CVE 일일 증분 수집 (KST 03:45)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/nvd_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  MitreCweCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-mitre-cwe-collector-${Environment}"
      Description: MITRE CWE XML zip → tb_cwe_dictionary UPSERT (약점 + 조치 가이드)
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref MitreCweScheduleExpression
            Description: MITRE CWE 분기 1회 수집 (1·4·7·10월 1일 KST 04:00)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/mitre_cwe_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  ExploitSignalCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-exploit-signal-collector-${Environment}"
      Description: Exploit-DB CSV + Metasploit metadata → tb_exploit_signal UPSERT (Pre-EPSS 선행)
      Timeout: 600
      MemorySize: 1024
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref ExploitSignalScheduleExpression
            Description: Exploit-DB/Metasploit 신호 수집 (rate 15 min, Pre-EPSS 선행)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/exploit_signal_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  KisaCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-kisa-collector-${Environment}"
      Description: KISA 보안공지 RSS → tb_vendor_advisory UPSERT (Trivy 미커버 한국 한정)
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref KisaScheduleExpression
            Description: KISA 보안공지 일 1회 수집 (KST 04:00)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/kisa_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  PsirtCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-psirt-collector-${Environment}"
      Description: 네트워크 장비 PSIRT 4벤더 통합 → tb_vendor_advisory UPSERT (Cisco/F5/PA/Forti)
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
          CISCO_PSIRT_SECRET_NAME: !Ref CiscoPsirtSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CiscoPsirtSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref PsirtScheduleExpression
            Description: PSIRT 4벤더 일 1회 수집 (KST 04:00)
            Enabled: true
    Metadata:
      Dockerfile: src/agents/psirt_collector/Dockerfile
      DockerContext: .
      DockerTag: latest

  # ───────────────────────────────────────────────────────────────────
  # Trivy 매칭 엔진 — ★ CVE 시나리오 핵심
  # 두 종류 EventBridge 트리거:
  #   (1) 일 1회 전체 자산 스캔 (TrivyScanScheduleExpression)
  #   (2) 6시간 DB 갱신 (TrivyDbRefreshScheduleExpression, mode=db_refresh)
  # 메모리·디스크 크게 (Trivy DB ~700MB + SBOM JSON + 결과)
  # ───────────────────────────────────────────────────────────────────
  TrivyScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-trivy-scan-${Environment}"
      Description: Trivy SBOM 스캔 → tb_asset_vulnerability INSERT (NVD+ALAS+RHSA+USN+MSRC+GHSA+OSV 통합)
      Timeout: 900                      # 15분 — 전체 자산 순회
      MemorySize: 3008                  # 3GB
      EphemeralStorage:
        Size: 4096                      # /tmp 4GB (SBOM·결과·DB 캐시 보조)
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
          TRIVY_CACHE_DIR: /opt/trivy-cache    # Dockerfile 에서 pre-download
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        DailyScanEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref TrivyScanScheduleExpression
            Description: Trivy 일일 전체 자산 스캔 (KST 04:30)
            Enabled: true
            Input: '{"mode":"all"}'
        DbRefreshEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref TrivyDbRefreshScheduleExpression
            Description: Trivy DB 6시간 갱신 (ghcr.io trivy-db pull)
            Enabled: true
            Input: '{"mode":"db_refresh"}'
    Metadata:
      Dockerfile: src/agents/trivy_scan/Dockerfile
      DockerContext: .
      DockerTag: latest

  CrowdStrikeAlertsCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-cs-alerts-collector-${Environment}"
      Description: CrowdStrike Alerts v2 실시간 수집 → tb_cs_alert + asset 매칭
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          CROWDSTRIKE_SECRET_NAME: !Ref CrowdStrikeSecretName
          DB_SECRET_NAME: !Ref DbSecretName
          ALERTS_LIMIT: "500"
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CrowdStrikeSecretName}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref CsAlertsScheduleExpression
            Description: CrowdStrike Alerts 15분 주기 수집
            Enabled: true
    Metadata:
      Dockerfile: src/agents/crowdstrike_alerts/Dockerfile
      DockerContext: .
      DockerTag: latest

  CrowdStrikeAppsCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-cs-apps-collector-${Environment}"
      Description: CrowdStrike Falcon Discover Applications 수집 → tb_asset_software + asset 매칭
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          CROWDSTRIKE_SECRET_NAME: !Ref CrowdStrikeSecretName
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CrowdStrikeSecretName}-*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref CsAppsScheduleExpression
            Description: CrowdStrike Apps (Discover) 일 1회 수집
            Enabled: true
    Metadata:
      Dockerfile: src/agents/crowdstrike_apps/Dockerfile
      DockerContext: .
      DockerTag: latest

  SbomIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "cmdb-sbom-ingest-${Environment}"
      Description: Ansible SBOM JSON (S3 PutObject) 적재 → tb_asset_software + asset 매칭
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          DB_SECRET_NAME: !Ref DbSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${SbomBucketName}/*"
      Events:
        SbomUploaded:
          Type: S3
          Properties:
            Bucket: !Ref SbomBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .json
    Metadata:
      Dockerfile: src/agents/sbom_ingest/Dockerfile
      DockerContext: .
      DockerTag: latest

  SbomBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SbomBucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSboms
            Status: Enabled
            ExpirationInDays: 90       # 90일 후 삭제 (DB에 들어간 후 보관 불필요)
            NoncurrentVersionExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ──────────────────────────────────────────────────────────────────────
  # asset_enrich — P1
  #
  # 2 트랙 ECS 컨테이너(Ansible / EPP)가 결과를 업로드하는 공통 S3 버킷.
  #
  #   Track A — Ansible (ECS Fargate · SSH/CLI)
  #     Key:  s3://gsretail-asset-enrich/{IDC_NW|ONPREM_UNIX|STORE_NW}/{date}.jsonl.gz
  #
  #   Track B — EPP (ECS Fargate · asyncio + httpx)
  #     Key:  s3://gsretail-asset-enrich/EPP/{date}.jsonl.gz
  #     (카테고리는 JSONL 줄별 category_cd 필드로: EPP_STORE_OA/EPP_OFFICE_OA/EPP_ETC_SERVER)
  #
  # Lifecycle: 30일 후 INTELLIGENT_TIERING, 90일 후 GLACIER, 365일 후 삭제.
  #
  # 후속 단계 (P2~P7):
  #   - AssetEnrichCluster (ECS Cluster, Ansible/EPP Task 공유)
  #   - AssetEnrichAnsibleTaskDefinition (Ansible 이미지)
  #   - AssetEnrichEppTaskDefinition (EPP 이미지)
  #   - AssetEnrichFunction (Lambda, S3 트리거)
  #   - EventBridge rules 4종 (Ansible 3 + EPP 1)
  #
  # 참조: src/agents/asset_enrich/README.md
  #       docs/asset-enrich-pipeline.md (v2.0)
  # ──────────────────────────────────────────────────────────────────────
  AssetEnrichBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref AssetEnrichBucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TieringAndExpiry
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  CrowdStrikeCollectorFunctionArn:
    Description: CrowdStrike Collector Lambda ARN
    Value: !GetAtt CrowdStrikeCollectorFunction.Arn
  CrowdStrikeCollectorFunctionName:
    Description: CrowdStrike Collector Lambda 함수명
    Value: !Ref CrowdStrikeCollectorFunction
  AwsEc2CollectorFunctionArn:
    Description: AWS EC2 Collector Lambda ARN
    Value: !GetAtt AwsEc2CollectorFunction.Arn
  AwsEc2CollectorFunctionName:
    Description: AWS EC2 Collector Lambda 함수명
    Value: !Ref AwsEc2CollectorFunction
  RagEmbedderFunctionArn:
    Description: RAG Embedder Lambda ARN
    Value: !GetAtt RagEmbedderFunction.Arn
  RagEmbedderFunctionName:
    Description: RAG Embedder Lambda 함수명
    Value: !Ref RagEmbedderFunction
  CrowdStrikeAppsCollectorFunctionArn:
    Description: CrowdStrike Apps Collector Lambda ARN
    Value: !GetAtt CrowdStrikeAppsCollectorFunction.Arn
  CrowdStrikeAppsCollectorFunctionName:
    Description: CrowdStrike Apps Collector Lambda 함수명
    Value: !Ref CrowdStrikeAppsCollectorFunction
  SbomIngestFunctionArn:
    Description: SBOM Ingest Lambda ARN
    Value: !GetAtt SbomIngestFunction.Arn
  SbomIngestFunctionName:
    Description: SBOM Ingest Lambda 함수명
    Value: !Ref SbomIngestFunction
  MitreCweCollectorFunctionArn:
